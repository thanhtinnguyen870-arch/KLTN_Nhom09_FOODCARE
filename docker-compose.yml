version: '3.8'

services:
  # Database MongoDB
  mongodb:
    image: mongo:7.0
    container_name: foodcare_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: foodcare
    volumes:
      - mongo_data:/data/db
    networks:
      - foodcare-network

  # Backend Node.js Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodcare_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/foodcare
      - NODE_ENV=production
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - foodcare-network

  # Frontend React SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodcare_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - foodcare-network

volumes:
  mongo_data:
    driver: local

networks:
  foodcare-network:
    driver: bridge
